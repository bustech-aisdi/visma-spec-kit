    document.addEventListener('DOMContentLoaded', () => {
        const slidesContainer = document.getElementById('slides-container');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const slideCounter = document.getElementById('slideCounter');
        let currentSlide = 0;

        function buildSlides() {
            slideData.forEach((slide, index) => {
                const slideEl = document.createElement('div');
                slideEl.className = 'slide absolute top-0 left-0 w-full h-full items-center justify-center';
                if (index === 0) slideEl.classList.add('active');

                let innerHTML = '';
                // Check for a full page slide flag
                if (slide.isFullPage) {
                    innerHTML = slide.content;
                } else {
                    innerHTML = '<div class="slide-content prose-slides">';
                    if(slide.title) {
                        innerHTML += `<h2 class="!text-3xl !mb-10 text-slate-800 font-bold tracking-tight text-center">${slide.title}</h2>`;
                    }
                    innerHTML += slide.content;
                    innerHTML += '</div>';
                }
                slideEl.innerHTML = innerHTML;
                slidesContainer.appendChild(slideEl);
            });
        }

        buildSlides();
        const slides = document.querySelectorAll('.slide');

        function showSlide(index) {
            slides.forEach((slide, i) => {
                slide.classList.toggle('active', i === index);
            });
            slideCounter.textContent = `${index + 1} / ${slides.length}`;
            prevBtn.disabled = index === 0;
            nextBtn.disabled = index === slides.length - 1;
            lucide.createIcons();
        }

        prevBtn.addEventListener('click', () => {
            if (currentSlide > 0) {
                currentSlide--;
                showSlide(currentSlide);
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                showSlide(currentSlide);
            }
        });

        // Keyboard navigation
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                nextBtn.click();
            } else if (e.key === 'ArrowLeft') {
                prevBtn.click();
            }
        });

        showSlide(currentSlide);
    });

    </script>
